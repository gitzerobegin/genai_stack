<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GenAI Stack Explorer</title>
<style>
:root{--bg:#F7F5F0;--panel:#fff;--ink:#0B1B33;--muted:#5B6B7A;--line:#E3E1DA;--accent:#0B1B33;--strat:#2E6DA4;--tact:#5B6B7A;--exp:#B07A1A;--ns:#888;--chip:#EEF3F8;--gold:#D4A13A}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#11151c;--panel:#1a2029;--ink:#e6e9ef;--muted:#9aa3b2;--line:#2a313c;--accent:#8fb3ff;--strat:#4fc98a;--tact:#e0b04a;--exp:#d58bd9;--chip:#232a35}}
:root[data-theme=dark]{--bg:#11151c;--panel:#1a2029;--ink:#e6e9ef;--muted:#9aa3b2;--line:#2a313c;--accent:#8fb3ff;--strat:#4fc98a;--tact:#e0b04a;--exp:#d58bd9;--chip:#232a35}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:14px 16px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:17px;margin:0;color:var(--accent)}.sub{color:var(--muted);font-size:12px}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}nav.tabs button{border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:6px 10px;border-radius:6px;cursor:pointer}
nav.tabs button.on{background:var(--accent);color:var(--panel);border-color:var(--accent)}
main{display:grid;grid-template-columns:260px 1fr;gap:0;min-height:calc(100vh - 60px)}
aside{border-right:1px solid var(--line);background:var(--panel);padding:10px;overflow:auto;max-height:calc(100vh - 60px);position:sticky;top:0}
aside .grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:10px 6px 4px}
aside button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13px}
aside button.on{background:var(--chip);font-weight:600}aside button small{color:var(--muted)}
section.view{padding:16px;max-width:1200px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters select,.filters input{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer}
.card h3{margin:0 0 4px;font-size:15px}.meta{color:var(--muted);font-size:12px}
.tier{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:10px;color:#fff}
.Strategic{background:var(--strat)}.Tactical{background:var(--tact)}.Experimental{background:var(--exp)}.Not.scored,.Not{background:var(--ns)}
.chip{display:inline-block;background:var(--chip);border-radius:10px;padding:0 7px;font-size:11px;margin:2px 3px 0 0}
.bar{height:6px;background:var(--chip);border-radius:3px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--accent)}
.detail{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:12px}
table{border-collapse:collapse;width:100%;margin:8px 0}td,th{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top;font-size:13px}
th{color:var(--muted);font-weight:600}.num{text-align:right;font-variant-numeric:tabular-nums}
.cmp{margin:0 0 0 auto}.cmpbox{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:8px 16px;display:none}
label.ck{font-size:12px;color:var(--muted);float:right}.prose{max-width:900px}.prose pre{white-space:pre-wrap;background:var(--chip);padding:10px;border-radius:8px;font-size:12px}
.note{color:var(--muted);font-size:12px}
@media (max-width:760px){main{grid-template-columns:1fr}aside{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line)}section.view{padding:16px}}
</style></head><body>

P4-6) ⟨AJ⟩.<\/p>\n<p><strong>The architectural reading in one paragraph.<\/strong> This is\na deterministic workflow, not a free agent. Every number comes from the\nattribution engine through a read-only tool; the model’s only job is to\nwrite narrative around figures it is given; a deterministic check proves\nevery figure in the draft matches the engine; and a named human\napproves. The LLM is therefore governed as a model-dependent use case\nunder the firm’s standard, and the use case is not Annex III ⟨AJ⟩.<\/p>\n<h2 id=\"vi.1-request-trace-rebuilt-with-the-recommended-components\">VI.1\nRequest trace, rebuilt with the recommended components<\/h2>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Step<\/th>\n<th>What happens<\/th>\n<th>Components<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>0<\/td>\n<td>Release manifest “commentary-release 2026.10” pinned: prompt set\nv14, drafting model@date (temperature 0), fallback model@date, embedding\nand reranker versions equal to the index <code>model_version<\/code> tag,\ntop-k 8, read-only tool list, guardrail policy v6, evaluation threshold\nset v3 (illustrative)<\/td>\n<td>C5<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>1<\/td>\n<td>Analyst signs in through SSO; workflow started for fund X, period\n2026-09<\/td>\n<td>C4<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>2<\/td>\n<td>Agent identity (registered; sponsor = head of performance reporting)\nobtains an on-behalf-of token: audience = attribution MCP server, scope\n<code>attribution.read<\/code>, minutes to live<\/td>\n<td>C4, C7<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>3a<\/td>\n<td><code>get_attribution_results(fund X, 2026-09, model v)<\/code>\nthrough the tool gateway: allow-list, definition hash, policy (fund\nwithin the analyst’s entitlements); snapshot ID and hash recorded as a\ndurable activity<\/td>\n<td>L4, C4, L3<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>3b<\/td>\n<td><code>get_fund_reference_data<\/code> (benchmark, share classes; no\nclient identifiers)<\/td>\n<td>L4<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>3c<\/td>\n<td><code>search_approved_commentary<\/code>: embed (pinned) →\nentitlement-filtered hybrid search over prior approved commentaries,\nstyle guide and approved market notes → rerank; chunks carry document\nID, version, ACL, trust tier and parse manifest<\/td>\n<td>L7, L6, L8<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>3d<\/td>\n<td>Retrieved chunks screened for indirect injection; a flagged chunk is\ndropped and logged<\/td>\n<td>C2, C7<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>3e<\/td>\n<td>Client identifiers tokenised (segregated mandates)<\/td>\n<td>C3<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>3f<\/td>\n<td>One LLM drafting step via gateway route\n<code>attribution-commentary-draft<\/code>: in-region primary model,\nqualified different-vendor fallback, budget and per-run ceiling; fails\nclosed if both are unavailable<\/td>\n<td>C1, L2, L1, C6<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>3g<\/td>\n<td>Output guards: deterministic numeric comparator (every figure, sign\nand direction word against the snapshot); PII re-check; placeholders\nunchanged; denied topics (forecasts, advice); narrative-grounding flags\nfor the reviewer<\/td>\n<td>C2, C3<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>3h<\/td>\n<td>Evaluation gate: numeric faithfulness 100% (blocking), groundedness,\nstyle, trajectory. A failure takes a bounded retry edge back to 3f, or\n“returned for revision”; never approval<\/td>\n<td>L9<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>3i<\/td>\n<td>Approval interrupt: a named PM (not the requester, not the agent)\nwith step-up authentication; decision, identity, edit diff and reason\ncode recorded<\/td>\n<td>L3, C4<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>4<\/td>\n<td>Release service publishes using the approver’s identity (outside the\nagent)<\/td>\n<td>L3<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>5<\/td>\n<td>Evidence pack written to the immutable archive, keyed by trace\nID<\/td>\n<td>C8<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>6<\/td>\n<td>The edit diff feeds the human-intervention metric and proposed style\nrules (pull request to C5)<\/td>\n<td>L9, C5<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2\nid=\"vi.2-per-layer-slice-cloud-neutral-with-aws-azure-google-cloud-equivalents\">VI.2\nPer-layer slice (cloud-neutral, with AWS / Azure / Google Cloud\nequivalents)<\/h2>\n<table style=\"width:100%;\">\n<colgroup>\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Layer / control<\/th>\n<th>What it does for this agent ⟨AJ⟩<\/th>\n<th>Cloud-neutral component ⟨Rec⟩<\/th>\n<th>AWS<\/th>\n<th>Azure<\/th>\n<th>Google Cloud<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>L1<\/td>\n<td>Primary drafting model, different-vendor fallback, small classifier,\nself-hosted open-weight model<\/td>\n<td>Two-vendor mid tier; Gemma 4 or Mistral Medium 3.5 self-hosted<\/td>\n<td>Claude Sonnet 5.5 primary (Bedrock EU); a GPT-6 tier (confirm EU\navailability) or Mistral as the independent fallback<\/td>\n<td>GPT-6.1 Sol primary, Mistral Medium 3.5 fallback<\/td>\n<td>Gemini 3.8 Flash primary; Claude Sonnet 5.5 via Google Cloud EU\nfallback, or Mistral as the independent alternative (confirm model and\nregion)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>L2<\/td>\n<td>In-region managed endpoint; reserved capacity for month-end;\nqualified fallback; vLLM stressed-exit route<\/td>\n<td>Primary cloud’s model service; vLLM private route for one\nopen-weight model<\/td>\n<td>Bedrock geographic or in-Region profile ⟨VF⟩<\/td>\n<td>Foundry Data Zone or Regional deployment, PTUs ⟨VF⟩<\/td>\n<td>Regional endpoint, Provisioned Throughput with overflow pinned\n⟨VF⟩<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>L3<\/td>\n<td>Pinned graph; one drafting step; eval gate as a hard edge; approval\ninterrupt; durable resume reuses the same snapshot<\/td>\n<td>LangGraph with a firm-controlled Postgres checkpointer, or Temporal\nactivities<\/td>\n<td>Strands on AgentCore Runtime ⟨VF⟩<\/td>\n<td>Microsoft Agent Framework Workflows on Foundry Hosted Agents\n⟨VF⟩<\/td>\n<td>ADK 2.0 Workflow Runtime on Agent Engine ⟨VF⟩<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>L4<\/td>\n<td>Read-only tools onto the attribution engine and fund reference data;\nsandbox for derived figures<\/td>\n<td>Read-only MCP servers owned by the engine team (alt: OpenAPI tools);\nE2B-style microVM sandbox, no egress<\/td>\n<td>AgentCore Gateway + Identity ⟨VF⟩<\/td>\n<td>APIM AI gateway + API Center private registry ⟨VF⟩<\/td>\n<td>Apigee MCP support ⟨VF⟩<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>L5<\/td>\n<td>Versioned style memory (glossary, approved style rules), recalled by\nversion hash<\/td>\n<td>No memory product: Git or the prompt store (C5) plus L6\nretrieval<\/td>\n<td>AgentCore Memory only if later needed ⟨VF⟩<\/td>\n<td>No Azure memory service profiled ⟨NPV⟩<\/td>\n<td>Memory Bank only if later needed ⟨VF⟩<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>L6<\/td>\n<td>One store, three collections; entitlement filter inside the search;\nhard empty result; retention per chunk<\/td>\n<td>pgvector on managed PostgreSQL, schema per segregated mandate;\nElasticsearch if already operated<\/td>\n<td>pgvector on RDS or Aurora ⟨VF⟩<\/td>\n<td>pgvector on Azure Database for PostgreSQL ⟨VF⟩<\/td>\n<td>pgvector on Cloud SQL ⟨VF⟩<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>L7<\/td>\n<td>Hybrid retrieval of comparable commentary; rerank by fund, period\nand theme<\/td>\n<td>Sentence Transformers model or Cohere private deployment, pinned;\nin-domain bake-off<\/td>\n<td>Cohere or Voyage on SageMaker ⟨VF⟩<\/td>\n<td>Cohere on Microsoft Foundry ⟨VF⟩<\/td>\n<td>Gemini Embedding 2, EU endpoint (excludes UK) ⟨VF⟩<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>L8<\/td>\n<td>Parse prior factsheets and commentaries; dual-parse tables and\nreconcile; register market-note licences<\/td>\n<td>Docling self-hosted; Unstructured ingest pattern for ACL capture;\nbuilt control envelope<\/td>\n<td>Same, on the firm’s AWS account (no AWS document service verified\n⟨NPV⟩)<\/td>\n<td>Same, on Azure (no Azure document service verified ⟨NPV⟩)<\/td>\n<td>Docling, or Document AI where confirmed in region ⟨VF⟩<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>L9<\/td>\n<td>Numeric faithfulness, groundedness, style, trajectory; regression\nsuite of 24–36 months; edit capture<\/td>\n<td>OTel Collector with redaction; Langfuse self-hosted or MLflow;\nDeepEval; Promptfoo plus an independent red-team tool<\/td>\n<td>MLflow on SageMaker ⟨VF⟩<\/td>\n<td>MLflow on Azure ML ⟨VF⟩<\/td>\n<td>Langfuse self-hosted (no native option profiled)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>C1<\/td>\n<td>Route with residency constraint, fallback, budgets, inline guards,\nMCP endpoint<\/td>\n<td>LiteLLM Enterprise or Kong AI Gateway hybrid<\/td>\n<td>AgentCore Gateway for tools; model routing on the cloud-neutral\ngateway ⟨VF⟩<\/td>\n<td>APIM GA AI policies ⟨VF⟩<\/td>\n<td>Apigee AI gateway ⟨VF⟩<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>C2<\/td>\n<td>Injection screening of retrieved chunks; numeric comparator; denied\ntopics<\/td>\n<td>Firm-coded comparator; NeMo Guardrails with Prompt Guard 2 plus a\nsecond detector<\/td>\n<td>Bedrock Guardrails (ApplyGuardrail) ⟨VF⟩<\/td>\n<td>Azure AI Content Safety Prompt Shields on documents ⟨VF⟩<\/td>\n<td>Model Armor, strict residency ⟨VF⟩<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>C3<\/td>\n<td>Tokenise client identifiers; re-identify only for the reviewer;\nredacted traces<\/td>\n<td>Presidio behind the firm’s privacy-service API<\/td>\n<td>Presidio, or Bedrock Guardrails PII filter behind the same API\n⟨VF⟩<\/td>\n<td>Presidio; Purview DSPM for posture ⟨VF⟩<\/td>\n<td>Sensitive Data Protection ⟨VF⟩<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>C4<\/td>\n<td>Agent identity with sponsor; OBO; deny-by-default policy; approver\nidentity<\/td>\n<td>Workforce IdP + OPA + SPIFFE/SPIRE<\/td>\n<td>AgentCore Identity + Policy (Cedar) ⟨VF⟩<\/td>\n<td>Entra Agent ID ⟨VF⟩<\/td>\n<td>Workforce IdP (Okta or Entra) + OPA; no Google agent-identity\nproduct profiled ⟨NPV⟩<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>C5<\/td>\n<td>Prompt set and release manifest in Git; PR with investment-risk\napprover; protected production label<\/td>\n<td>Prompty or Dotprompt files; registry of the L9 platform<\/td>\n<td>Same<\/td>\n<td>Same<\/td>\n<td>Same<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>C6<\/td>\n<td>Cost per approved commentary; budget that fails closed; loop\nalerts<\/td>\n<td>Gateway virtual keys; FOCUS-shaped dataset<\/td>\n<td>Bedrock application inference profiles ⟨VF⟩<\/td>\n<td>Foundry project cost tags ⟨VF⟩<\/td>\n<td>Not profiled<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>C7<\/td>\n<td>No outbound channel; secrets brokered; canary documents; pinned\ndependencies<\/td>\n<td>Vault agentic IAM or cloud secrets plus workload identity; private\npackage mirror<\/td>\n<td>Same<\/td>\n<td>Same<\/td>\n<td>Same<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>C8<\/td>\n<td>Inventory entry; validation; evidence pack; quarterly\nattestation<\/td>\n<td>Firm evidence store; OpenLineage; governance tool optional<\/td>\n<td>Same<\/td>\n<td>Same<\/td>\n<td>Same<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Why the L1 row names Claude as primary only for AWS.<\/strong>\nIn the L1 section’s per-cloud portfolio, Claude Sonnet 5.5 is the\nprimary drafting model only in an AWS estate and the fallback in a\nGoogle Cloud estate; GPT-6.1 Sol, Gemini 3.8 Flash and Mistral Medium\n3.5 are named as independent alternatives in the same table ⟨AJ⟩.\nClaude’s EU processing runs through Bedrock or Google Cloud regional\nendpoints, not the first-party API ⟨VF⟩. GPT-6 Astra on Bedrock is\nin-Region only in two US Regions, so EU availability of any GPT-6 tier\non Bedrock must be confirmed per model ⟨VF⟩.<\/p>\n<p><strong>What it costs ⟨AJ⟩.<\/strong> On the C6 worked arithmetic, a\ndraft of about 40,000 input and 3,000 output tokens on a mid-tier model\nat US$2 / US$10 per 1M tokens (the list price of both Claude Sonnet 5.5\nand GPT-6.1 Sol as of 7 October 2026 ⟨VF⟩) costs about US$0.11, and with\njudges and an average of 2.5 drafts per approved commentary the token\ncost is roughly US$0.30, or about US$12 a month for 40 funds. The token\nfigures are the author’s own. The conclusion matters more than the\nnumber: tokens are not the cost driver; reviewer time is, so the metric\nto manage is the regeneration and edit rate ⟨AJ⟩.<\/p>\n<p><strong>The threat it is built to survive ⟨AJ⟩.<\/strong> C7’s\nscenario is a third-party market note containing hidden text telling the\nmodel to state that currency hedging added 40 basis points and to send\nthe draft elsewhere. The defence is layered so that no single control\nhas to catch it: there is no outbound tool to hijack; the numeric\ncomparator fails any figure not in the engine snapshot; retrieved text\nis wrapped as data; a detector screens retrieved chunks and quarantines\nthe source; canary documents in staging fail the release gate; and the\nPM approves before release.<\/p>\n<h2 id=\"vi.3-boundaries\">VI.3 Boundaries<\/h2>\n<p><strong>What the agent may do ⟨Rec⟩:<\/strong> - draft narrative text\naround figures supplied by the attribution engine; - explain allocation,\nselection and currency effects in the house style; - reference market\ncontext from approved, registered sources, with citations to document\nversions; - propose wording, and propose new style rules as a pull\nrequest for human approval.<\/p>\n<p><strong>What the agent must never do, and the component that enforces\nit ⟨Rec⟩:<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Never<\/th>\n<th>Enforced by<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Generate, round, recompute or “correct” an authoritative number<\/td>\n<td>L4 read-only tools; C2 numeric comparator; L9 blocking eval; L1\nboundary<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Use a figure from retrieved commentary, memory or a parsed document\nas data<\/td>\n<td>L8 <code>document_derived<\/code> tag; L6/L7 context-only rule; L5\ncontradiction check<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Present inference as source data<\/td>\n<td>C2 narrative grounding; L9 groundedness; citations to document\nversions<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Publish without recorded human approval<\/td>\n<td>L3 approval interrupt; release service acting on the approver’s\nidentity; C4 segregation of duties<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Produce an output that cannot be reproduced, or discard evaluation\nevidence<\/td>\n<td>C5 manifest; C8 evidence pack in the firm archive; L9 retention\nbeyond any vendor tier<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Call a write, publish, e-mail or HTTP tool<\/td>\n<td>L4 allow-list (no such tool exists); C4 policy; C7 capability\nseparation<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Send client identifiers to an external model, search or SaaS\nstore<\/td>\n<td>C3 tokenisation; L4 egress proxy; L9 Collector redaction<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Retrieve another fund’s or client’s material<\/td>\n<td>L6 entitlement filter inside the search; partition per segregated\nmandate; CI cross-fund probes<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Run on a model alias, a preview model or an unqualified\nfallback<\/td>\n<td>C1 route definition; C5 pins; L9 re-qualification<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Mix two attribution snapshots in one draft after a resume<\/td>\n<td>L3 durable activity reuses the recorded snapshot<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"vi.4-the-audit-evidence-pack\">VI.4 The audit evidence pack<\/h2>\n<p>Each approved commentary produces one evidence pack, written\nautomatically to the firm’s immutable archive at approval and keyed by\ntrace ID (C8 §C8.12) ⟨Rec⟩:<\/p>\n<table style=\"width:100%;\">\n<colgroup>\n<col style=\"width: 30%\" />\n<col style=\"width: 23%\" />\n<col style=\"width: 23%\" />\n<col style=\"width: 23%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: right;\">#<\/th>\n<th>Element<\/th>\n<th>Contents<\/th>\n<th>Produced by<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: right;\">1<\/td>\n<td>Prompt version<\/td>\n<td>Template ID and version; system-prompt hash; rendered prompt\n(tokenised per C3); release manifest ID<\/td>\n<td>C5, C3<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: right;\">2<\/td>\n<td>Model version<\/td>\n<td>Provider, model ID and exact version as returned by the gateway (not\nthe alias); parameters; processing region; fallback flag<\/td>\n<td>C1, L2<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: right;\">3<\/td>\n<td>Data snapshot<\/td>\n<td>Attribution snapshot hash and run ID; holdings and benchmark as-of\ndates; retrieved document IDs, versions, trust tiers and scores; index\nversion; embedding and reranker versions; parse manifests<\/td>\n<td>L4, L6, L7, L8<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: right;\">4<\/td>\n<td>Tool calls<\/td>\n<td>Each call with arguments hash, response hash, definition hash,\npolicy decision, latency, and the identities used (agent and\non-behalf-of analyst)<\/td>\n<td>L4, C4, C7<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: right;\">5<\/td>\n<td>Evaluation results<\/td>\n<td>Numeric faithfulness per figure; groundedness; style; trajectory;\ndetector verdicts; metric-code and judge versions; thresholds<\/td>\n<td>L9, C2, C7<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: right;\">6<\/td>\n<td>Approver<\/td>\n<td>PM’s authenticated identity; decision; edit diff between draft and\nfinal; reason code<\/td>\n<td>L3, C4<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td style=\"text-align: right;\">7<\/td>\n<td>Timestamps<\/td>\n<td>Request, each step, evaluation, approval and release, from a\nsynchronised clock<\/td>\n<td>L9<\/td>\n<\/tr>\n<tr class=\"even\">\n<td style=\"text-align: right;\">8<\/td>\n<td>Final output and cost<\/td>\n<td>Released text and hash; distribution record; tokens and cost per\ncommentary<\/td>\n<td>L3, C6<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The inventory entry that governs the use case records its owner,\naccountable SMF, materiality tier (tier 1: client-facing, regulated\ncommunication, uses model outputs), EU AI Act category (not Annex III;\nArticle 50 assessed, human editorial review applies), outsourcing\nentries, the full version bundle, validation reference and use\nlimitations (“no figures generated by the model”), monitoring thresholds\n(numeric faithfulness 100%), change triggers and a quarterly review\ncycle (C8 §C8.12) ⟨AJ⟩. Pinning versions and keeping a fallback\nqualified on the same suite is also the SS2/21 exit route ⟨VF⟩ ⟨AJ⟩.<\/p>\n<hr />\n", "hyp": "<h1 id=\"part-iii-architecture-hypotheses-verdicts-h1h8\">Part III:\nArchitecture hypotheses — verdicts (H1–H8)<\/h1>\n<p>The plan required the nine-layer structure to be tested, not assumed\n(plan §4). Each hypothesis below gives the evidence the sections\ngathered, the counter-evidence, a verdict (keep / rename / merge / split\n/ reposition) and the resulting change to the architecture ⟨AJ⟩. The\nverdicts are summarised first.<\/p>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>#<\/th>\n<th>Hypothesis<\/th>\n<th>Verdict<\/th>\n<th>Resulting architecture change<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>H1<\/td>\n<td>Split L2; promote the gateway to the control plane<\/td>\n<td><strong>Split<\/strong> (L2) and <strong>reposition<\/strong>\n(gateway)<\/td>\n<td>L2 becomes model access · serving engines · optional optimisation;\nC1 becomes the “AI traffic gateway” for model, tool and agent calls\n⟨AJ⟩<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>H2<\/td>\n<td>Distinguish deterministic workflows from autonomous agents<\/td>\n<td><strong>Split<\/strong> (into sub-layers of one layer) and\n<strong>rename<\/strong><\/td>\n<td>L3 “Orchestration: workflows and agents”, with three stacked\nconcerns: workflow orchestration (default), bounded agent steps, durable\nexecution and runtime ⟨AJ⟩<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>H3<\/td>\n<td>An agent identity, authorisation and tool-governance sub-layer<\/td>\n<td><strong>Keep<\/strong>, implemented as a split<\/td>\n<td>L4 gains a mandatory tool-governance sub-layer (the enforcement\npoint); the decisions it enforces sit in C4 with C7 as one\nidentity-and-credential plane ⟨AJ⟩<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>H4<\/td>\n<td>Memory is not separate from retrieval and data<\/td>\n<td><strong>Merge<\/strong><\/td>\n<td>L5 merges physically into the stores layer; a thin “L5 memory\nservice” stays as a governed logical component; organisational memory\nmoves to C5; built last ⟨AJ⟩<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>H5<\/td>\n<td>“Vector database” becomes “Retrieval / Knowledge Stores”<\/td>\n<td><strong>Rename<\/strong><\/td>\n<td>L6 “Retrieval, knowledge and memory stores”: a derived,\nentitlement-filtered, rebuildable index with four implementation options\n⟨AJ⟩<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>H6<\/td>\n<td>Embeddings and reranking form one retrieval-optimisation layer<\/td>\n<td><strong>Merge<\/strong><\/td>\n<td>L7 “Retrieval optimisation”: model choice, version pinning (held in\nC5), hybrid fusion policy and the retrieval evaluation gate ⟨AJ⟩<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>H7<\/td>\n<td>Ingestion includes lineage, classification, PII/DLP, access-control\nmetadata and incremental indexing<\/td>\n<td><strong>Keep<\/strong>, with a scope change (and runtime web access\nrepositioned to L4)<\/td>\n<td>L8 “Ingestion and data preparation” with a built ingestion control\nenvelope around replaceable parsers; policy from C3, evidence to C8\n⟨AJ⟩<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>H8<\/td>\n<td>Evaluation and observability are cross-cutting<\/td>\n<td><strong>Reposition<\/strong><\/td>\n<td>L9 leaves the bottom of the stack and becomes the evaluation and\nobservability plane, joined with C8 as one evidence plane with two\nowners ⟨AJ⟩<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2\nid=\"h1-split-l2-into-serving-optimisation-gatewayrouting-and-promote-the-gateway\">H1:\nSplit L2 into serving → optimisation → gateway/routing, and promote the\ngateway<\/h2>\n<p><strong>Hypothesis.<\/strong> L2 should split into model serving,\ninference optimisation and model gateway/routing, with the gateway\npromoted to a control-plane component (plan §4) ⟨AJ⟩.<\/p>\n<p><strong>Evidence.<\/strong> - <em>Optimisation products define\nthemselves as a separate layer.<\/em> NVIDIA Dynamo calls itself “the\norchestration layer above inference engines”, llm-d provides\norchestration “above model servers”, and LMCache calls itself “a KV\ncache management layer” ⟨VF⟩. - <em>Access has separated from\nserving.<\/em> Hugging Face Inference Endpoints exposes the engine as a\nsetting, routers aggregate many providers, and the hyperscalers sell\nprocessing location and reserved capacity as properties of the access\ncontract ⟨VF⟩. - <em>The gateway carries more than model traffic.<\/em>\nLiteLLM describes one control plane for LLMs, MCP servers and A2A\nagents, and Kong, Azure API Management, Apigee and agentgateway govern\nall three ⟨VF⟩. AWS’s AgentCore Gateway grew from tools towards models\n⟨VF⟩. - <em>Vendors call it a control plane, and the other controls run\ninline in it.<\/em> Cloudflare markets an “AI Application Control Plane”\nand Microsoft is integrating APIM as Foundry’s AI gateway control plane\n⟨VF⟩. Guardrails, DLP, tool policy and cost attribution all run at the\ngateway ⟨VF⟩. - <em>Security vendors are buying it.<\/em> Palo Alto\nNetworks bought Portkey to put a gateway “in the traffic path” ⟨VF⟩. -\n<em>L1 depends on it.<\/em> A model portfolio with residency routing,\nversion pinning, fallback and deny-lists is unworkable without a\nfirm-owned gateway (L1 hypothesis note) ⟨AJ⟩. Cost metering and\nenforcement also settle at the gateway ⟨VF⟩ (C6).<\/p>\n<p><strong>Counter-evidence.<\/strong> - vLLM and SGLang ship prefix\ncaching, speculative decoding, quantisation and disaggregation inside\nthe engine, so for most firms “optimisation” is engine configuration,\nnot a product ⟨VF⟩. - Dynamo and llm-d plug into the Gateway API\nInference Extension, which blurs the boundary with the gateway at the\nKubernetes edge ⟨VF⟩. That router chooses a replica; C1 chooses a\nprovider, model and region ⟨AJ⟩. - Microsoft says its AI gateway is an\nextension of the API gateway, “not a separate offering” ⟨VF⟩. The AI\ngateway may converge into API management rather than stand alone ⟨AJ⟩. -\nThe March 2026 LiteLLM compromise shows the blast radius of\nconcentrating control in one component ⟨VF⟩ ⟨AJ⟩.<\/p>\n<p><strong>Verdict: split L2 and reposition the gateway ⟨AJ⟩.<\/strong>\nThe split is real, but the order in the hypothesis is wrong for an\nenterprise: model access is the sub-layer most firms will actually\noperate, serving engines matter only where a private route is justified,\nand optimisation is optional and relevant only to firms that run their\nown GPU fleets ⟨AJ⟩.<\/p>\n<p><strong>Resulting architecture change ⟨Rec⟩.<\/strong> - L2 is renamed\n<strong>“Inference and model access”<\/strong>, drawn as three\nsub-layers: <em>model access<\/em> (the primary cloud’s model service,\nmanaged inference clouds, dedicated endpoints, routers), <em>serving\nengines<\/em> (vLLM, SGLang as the qualified backup), and <em>inference\noptimisation<\/em> (llm-d, Dynamo, LMCache; optional, marked “own-GPU\nestates only”). - Routing policy, fallback, budgets, guard invocation\nand the request log leave L2 and become <strong>C1, the AI traffic\ngateway<\/strong>, covering model, tool (MCP) and agent (A2A) calls. C1\nis drawn as a logical control that may be implemented on the firm’s\nAPI-management platform, deployed twice, failing closed. - Agent logic\nnever lives in the gateway; it routes and records, it does not\nauthor.<\/p>\n<h2 id=\"h2-an-agent-framework-is-not-one-layer\">H2: An “agent framework”\nis not one layer<\/h2>\n<p><strong>Hypothesis.<\/strong> Architecture should distinguish\ndeterministic workflows from autonomous agents (plan §4) ⟨AJ⟩.<\/p>\n<p><strong>Evidence.<\/strong> - <em>Every major framework ships both\nmodes, and several document the split.<\/em> LangGraph combines\ndeterministic logic and LLM decisions in one graph; Microsoft Agent\nFramework separates Agents from Workflows; CrewAI pairs Flows with Crews\nand recommends Flows as the outer process; Google ADK 2.0 added a\nWorkflow Runtime; LlamaIndex, Mistral and Vercel ship workflow engines\n⟨VF⟩. Anthropic’s own guidance separates workflows from agents in the\nsame terms ⟨VF⟩. - <em>Durability is separating from both.<\/em> Pydantic\nAI v2 delegates durability to Temporal, DBOS or Prefect; the OpenAI\nAgents SDK integrates Temporal and DBOS; Mistral built Workflows on\nTemporal ⟨VF⟩. - <em>Runtimes are separating from frameworks.<\/em>\nAgentCore hosts agents from several frameworks with per-session microVM\nisolation, and Foundry Hosted Agents accepts agents built with any\nframework ⟨VF⟩. - <em>Visual builders are retreating.<\/em> OpenAI is\nretiring Agent Builder on 30 November 2026 and points code users to the\nSDK ⟨VF⟩. - <em>Guardrails cannot rescue the wrong design.<\/em> The\nnewest guardrail features for agent behaviour (Task Adherence,\nAlignmentCheck) are preview or unmaintained ⟨VF⟩, which supports\ndeciding autonomy first (C2) ⟨AJ⟩. - <em>Supervisors want a human in the\nloop.<\/em> The OCC observes banks adopting agentic AI “with guardrails\nand human-in-the-loop accountability” ⟨VF⟩, and the Bank of England\nfound 55% of AI use cases had some autonomous decision-making and 2%\nwere fully autonomous ⟨VF⟩.<\/p>\n<p><strong>Counter-evidence.<\/strong> The split is two modes inside one\nframework, not two products with separate vendors ⟨AJ⟩. Single-mode\nautonomous harnesses (the OpenAI and Claude agent SDKs, Mistral’s Agents\nAPI) are moving fastest ⟨VF⟩.<\/p>\n<p><strong>Verdict: split, as sub-layers of one layer, and rename\n⟨AJ⟩.<\/strong> Drawing workflows and agents as two separate layers would\nimply two vendors and two integration surfaces where one framework does\nboth ⟨AJ⟩.<\/p>\n<p><strong>Resulting architecture change ⟨Rec⟩.<\/strong> - L3 is renamed\n<strong>“Orchestration: workflows and agents”<\/strong>, with three\nstacked concerns: (1) <em>deterministic workflow orchestration<\/em>\n(graph, state, approvals), the default for enterprise processes; (2)\n<em>bounded autonomous agent steps<\/em>, admitted per use case with a\ndeclared autonomy budget, a tool allow-list and a sandbox; (3)\n<em>durable execution and managed runtime<\/em> (Temporal or DBOS;\nAgentCore Runtime, Foundry Hosted Agents or Agent Engine) beneath both.\n- Use-case classification (“is the sequence known in advance?”) happens\nbefore any framework choice (L3 §3.9 step 0). Most regulated\nasset-management “agents” are workflows with one judgement step. -\nModel-vendor harnesses (OpenAI Agents SDK, Claude Agent SDK) appear only\ninside concern (2), as replaceable nodes, with a model-agnostic\nequivalent kept available.<\/p>\n<h2\nid=\"h3-an-agent-identity-authorisation-and-tool-governance-sub-layer\">H3:\nAn agent identity, authorisation and tool-governance sub-layer<\/h2>\n<p><strong>Hypothesis.<\/strong> Tools and protocols need an explicit\nagent identity, authorisation and tool-governance sub-layer (plan §4)\n⟨AJ⟩.<\/p>\n<p><strong>Evidence.<\/strong> - <em>The protocol leaves room for\ngovernance but does not supply it.<\/em> MCP 2026-07-28 puts method and\ntool names in headers for gateways and deprecates Dynamic Client\nRegistration, but authorisation remains optional and tool annotations\nremain hints ⟨VF⟩. MCP’s own roadmap says today’s model assumes a person\napproving access in a browser, and names agent identity (DPoP, Workload\nIdentity Federation) as a priority ⟨VF⟩. - <em>A2A leaves the same\ngap.<\/em> Agent Card signing is optional and delegated-authority\nsemantics are undefined ⟨VF⟩. - <em>The building blocks are GA.<\/em>\nEntra Agent ID, Auth0 and Okta for AI Agents, Okta Agent SSO (which Okta\nstates is the MCP Enterprise-Managed Authorization extension),\nCedar-based AgentCore Policy, and graduated SPIFFE/SPIRE and OPA ⟨VF⟩.\nVault’s agentic IAM enforces request-scoped, on-behalf-of authority\n⟨VF⟩. - <em>Gateways implement tool governance today.<\/em> Kong offers\nMCP access controls and token exchange, LiteLLM filters tools per key,\nand Azure API Management brokers OAuth for MCP servers ⟨VF⟩. AgentCore\nGateway, Identity and Policy implement the whole sub-layer as a managed\nservice ⟨VF⟩. - <em>There is no trustworthy public allow-list.<\/em> The\nofficial MCP Registry is preview at API v0.1 and moderates by\ndenylisting; enterprises build private registries in GitHub and Azure\nAPI Center ⟨VF⟩. - <em>The threat lists name the gap.<\/em> OWASP’s\nagentic list includes ASI02 Tool Misuse and ASI03 Identity and Privilege\nAbuse ⟨VF⟩, and the Composio incident shows the cost of a third party\nholding every user’s tokens ⟨VF⟩.<\/p>\n<p><strong>Counter-evidence.<\/strong> The products that implement the\nsub-layer are the C1 gateways and C4 identity services, not new L4\nproducts, so a separate box could duplicate them ⟨AJ⟩. The control also\nspans the identity provider, the gateway, the tool servers and the\nsecrets broker, which argues for a control-plane component rather than a\nsub-layer (C4 §C4.13) ⟨AJ⟩.<\/p>\n<p><strong>Verdict: keep, implemented as a split ⟨AJ⟩.<\/strong> The two\nsection views are both right about different things. The <em>enforcement\npoint<\/em> must sit physically between L3 and the tools, so that no tool\nis reachable except through it; the <em>decisions<\/em> (who the agent\nis, on whose behalf it acts, which policy applies, which credential is\nissued) belong to the control plane ⟨AJ⟩.<\/p>\n<p><strong>Resulting architecture change ⟨Rec⟩.<\/strong> - L4 is renamed\n<strong>“Tools and connectivity”<\/strong> and gains a mandatory\n<strong>tool-governance sub-layer<\/strong>: the tool gateway (usually\nthe C1 product’s MCP endpoint), the private allow-listed registry,\nhash-pinned tool definitions, the policy enforcement point and the\nper-call audit event. - C4 (identity and authorisation) and C7 (secrets\nand credentials) are designed as <strong>one identity-and-credential\nplane<\/strong>, drawn as two controls: C4 owns agent registration,\ndelegation and policy (OPA or Cedar in Git); C7 owns credential\nissuance. - MCP is the default agent-to-tool protocol, Strategic only\nbehind this sub-layer (the reader’s CP3 decision; MCP originated at\nAnthropic). Its independent alternative is OpenAPI-described tools\nbehind the same gateway; A2A is used only where cross-team or\ncross-vendor delegation is in scope.<\/p>\n<h2\nid=\"h4-memory-may-not-be-separate-from-retrieval-and-data-architecture\">H4:\nMemory may not be separate from retrieval and data architecture<\/h2>\n<p><strong>Hypothesis.<\/strong> Memory may not be separate from\nretrieval and data architecture; conversation, working, episodic,\nsemantic, organisational and long-term memory should be distinguished\nfrom knowledge bases (plan §4) ⟨AJ⟩.<\/p>\n<p><strong>Evidence.<\/strong> - <em>Memory products are retrieval stacks\nwith an extraction step.<\/em> Mem0, Graphiti, Cognee, LangMem and Letta\nstore memory in SQL, vector, graph, LangGraph-store or git-backed file\nstores, and recall with the same hybrid semantic, keyword and graph\nsearch as knowledge retrieval ⟨VF⟩. - <em>Products are converging with\nRAG.<\/em> Supermemory combines RAG and memory in one query, and Cognee\nand Zep ingest documents and business data into the same graph as\nconversations ⟨VF⟩. - <em>Platforms are absorbing memory.<\/em> AWS and\nGoogle ship memory inside their agent platforms; Anthropic’s memory tool\nruns file operations on storage the developer controls; OpenAI persists\nconversation state through its Conversations API ⟨VF⟩. - <em>The\nindependent layer is thinning<\/em> (finding 7 in Part I) ⟨VF⟩. - <em>The\nworked example needs no memory product.<\/em> Its “memory of terminology\nand the PM’s edits” is a governed, versioned style artefact in Git or\nthe prompt store (L5 §5.12) ⟨AJ⟩.<\/p>\n<p><strong>Counter-evidence.<\/strong> Memory has a write path that\nretrieval does not: extraction, consolidation, contradiction handling\nand decay ⟨VF⟩. Its governance differs in kind, because it is written by\nan agent, is per subject and must be erasable per person ⟨AJ⟩. Both\nhyperscalers chose to expose memory as a distinct service, not as a\nfeature of their vector stores ⟨VF⟩.<\/p>\n<p><strong>Verdict: merge ⟨AJ⟩.<\/strong> Memory should not be a separate\ninfrastructure layer ⟨AJ⟩. The counter-evidence is about governance, not\nstorage, so it justifies a logical component, not a layer ⟨AJ⟩.<\/p>\n<p><strong>Resulting architecture change ⟨Rec⟩.<\/strong> - Physically,\nmemory is stored in the firm’s L6 stores; the layer is renamed\n<strong>“Retrieval, knowledge and memory stores”<\/strong> (see H5). -\nLogically, a thin <strong>L5 memory service<\/strong> remains in the\ndiagram, because it carries the controls unique to memory: the\npolicy-gated write path, the subject index, retention and erasure\n“beyond use”, and a memory snapshot ID per run. - Organisational and\nprocedural memory (style rules, glossaries) is not agent memory: it is a\nversioned artefact in C5, proposed by the agent and approved by a\nperson. - Memory is built last (Phase 6). Hyperscaler memory (AgentCore\nMemory, Memory Bank) is used only where the agent runtime already lives\non that cloud.<\/p>\n<h2 id=\"h5-vector-database-should-become-retrieval-knowledge-stores\">H5:\n“Vector database” should become “Retrieval / Knowledge Stores”<\/h2>\n<p><strong>Hypothesis.<\/strong> The “vector database” layer should be\nrenamed Retrieval / Knowledge Stores (plan §4) ⟨AJ⟩.<\/p>\n<p><strong>Evidence.<\/strong> - <em>Hybrid is standard.<\/em> Lexical and\nvector retrieval with fusion ships in turbopuffer, Chroma Cloud, Milvus,\nElasticsearch, MongoDB, Qdrant, Pinecone and Weaviate ⟨VF⟩. A\nvector-only store such as S3 Vectors is positioned by its own vendor as\na tier behind a search engine ⟨VF⟩. - <em>General-purpose databases\nabsorbed the feature.<\/em> PostgreSQL (pgvector), MongoDB including\nself-managed Community Edition, and Elasticsearch offer vector retrieval\nin platforms firms already run ⟨VF⟩. - <em>Storage is moving to object\nstores.<\/em> S3 Vectors, Milvus 3.0 and turbopuffer keep durable vectors\nin object storage ⟨VF⟩. - <em>Vendors reposition above the store.<\/em>\nPinecone sells Nexus as a “knowledge engine for agents”, and Elastic\ncalls itself “the Search AI Company” ⟨VF⟩.<\/p>\n<p><strong>Counter-evidence.<\/strong> Dedicated engines still\ndifferentiate on filtered search, tenant isolation and scale ⟨VF⟩, so\nthe category survives as one implementation option ⟨AJ⟩. “Knowledge\nstore” risks overlapping with memory and ingestion, because Nexus\nreaches into both ⟨VF⟩ ⟨AJ⟩.<\/p>\n<p><strong>Verdict: rename ⟨AJ⟩.<\/strong> The H4 merge extends the\nname.<\/p>\n<p><strong>Resulting architecture change ⟨Rec⟩.<\/strong> - L6 becomes\n<strong>“Retrieval, knowledge and memory stores”<\/strong>, defined by\nresponsibility: a derived, entitlement-filtered, rebuildable index over\napproved content, never the system of record. - Four implementation\noptions sit beneath it: vectors in the operational database (pgvector,\nMongoDB), search engines (Elasticsearch, OpenSearch), dedicated vector\nengines (Qdrant, Milvus; Pinecone or turbopuffer BYOC), and object-store\ntiers (S3 Vectors). - Knowledge-engine products sit at the boundary with\nL8 and the memory service, and their compiled outputs are treated as\ndisposable derived data. - The defining duties are entitlement filtering\ninside the search, tenant isolation, rebuild-from-source tested twice a\nyear, and erasure that reaches the index.<\/p>\n<h2\nid=\"h6-embeddings-and-reranking-form-one-retrieval-optimisation-layer\">H6:\nEmbeddings and reranking form one retrieval-optimisation layer<\/h2>\n<p><strong>Hypothesis.<\/strong> Embeddings and reranking form one\nretrieval-optimisation layer (plan §4) ⟨AJ⟩.<\/p>\n<p><strong>Evidence.<\/strong> - <em>Vendors ship both.<\/em> Six of the\nseven verified model vendors offer an embedding model and a reranker;\nGoogle’s reranker is a separate Vertex ranking API ⟨VF⟩. Sentence\nTransformers covers both in one library ⟨VF⟩. - <em>The two are\nevaluated and versioned together<\/em>, and changing the embedding model\nforces the whole corpus to be re-embedded (L7 §7.10) ⟨AJ⟩. - <em>The\ncompute is moving into the store.<\/em> MongoDB, Pinecone and Elastic\nhost embedding and reranking natively ⟨VF⟩. - <em>Configuration\nmanagement needs the pins.<\/em> C5’s release manifest pins the embedding\nand reranker versions and enforces the dual-index migration (C5 §C5.13)\n⟨AJ⟩.<\/p>\n<p><strong>Counter-evidence.<\/strong> Store-hosted models blur the line\nbetween L6 and L7; MongoDB’s native reranking and automated embedding\nare still preview and do not yet support Geography targeting ⟨VF⟩.<\/p>\n<p><strong>Verdict: merge ⟨AJ⟩.<\/strong> The layer should be defined by\nresponsibility, not by where the compute runs ⟨AJ⟩.<\/p>\n<p><strong>Resulting architecture change ⟨Rec⟩.<\/strong> - L7 becomes\n<strong>“Retrieval optimisation”<\/strong>: model choice by in-domain\nevaluation, version pinning, hybrid fusion policy, reranking and the\nretrieval evaluation gate, whether the models run as APIs, in the estate\nor inside the store. - Embedding-model version is named explicitly as a\ngoverned configuration item in C5, because it is the one decision in\nthis layer with a corpus-wide migration cost. - A thin internal service\n(<code>embed<\/code>, <code>rerank<\/code>) keeps raw text and a\n<code>model_version<\/code> tag on every vector, and migrates by dual\nindex behind an L9 regression gate.<\/p>\n<h2\nid=\"h7-ingestion-must-include-lineage-classification-piidlp-access-control-metadata-and-incremental-indexing\">H7:\nIngestion must include lineage, classification, PII/DLP, access-control\nmetadata and incremental indexing<\/h2>\n<p><strong>Hypothesis.<\/strong> Ingestion must include lineage,\nclassification, PII detection/DLP, access-control metadata and\nincremental indexing (plan §4) ⟨AJ⟩.<\/p>\n<p><strong>Evidence.<\/strong> - <em>Products cover only fragments.<\/em>\nUnstructured captures ACLs and reprocesses on permission change;\nFirecrawl redacts PII and offers ZDR; no L8 product emits lineage ⟨VF⟩.\n- <em>The lineage standard lacks GenAI facets.<\/em> OpenLineage is the\nneutral standard with Airflow, Spark, dbt and Flink coverage, but has no\nGenAI-specific facets ⟨VF⟩. Collibra integrates OpenLineage with an AI\nuse-case register, the first verified bridge between AI governance and\ndata lineage ⟨VF⟩. - <em>DLP applies at ingestion as well as at run\ntime.<\/em> Sensitive Data Protection de-identifies stores, Presidio is\ndesigned for pipelines, and Skyflow de-identifies before ingestion ⟨VF⟩.\n- <em>Decisions made at ingestion cannot be undone downstream.<\/em> Once\na document has gone to a third-party parser and been indexed without its\nACL, no prompt-level control can repair it (L8 §8.11) ⟨AJ⟩. - <em>Agents\nread documents, so ingestion is an attack path.<\/em> ASI01 Agent Goal\nHijack can arrive through indirect injection in documents ⟨VF⟩ ⟨AJ⟩.<\/p>\n<p><strong>Counter-evidence.<\/strong> DLP is being absorbed into\ngateways and guardrails ⟨VF⟩, and runtime lineage for LLM calls lives in\nOpenTelemetry traces, not OpenLineage ⟨AJ⟩.<\/p>\n<p><strong>Verdict: keep, with a scope change; runtime web access is\nrepositioned to L4 ⟨AJ⟩.<\/strong> The enterprise additions are not\nproduct features to buy but a control envelope to build around\nreplaceable parsers ⟨AJ⟩.<\/p>\n<p><strong>Resulting architecture change ⟨Rec⟩.<\/strong> - L8 becomes\n<strong>“Ingestion and data preparation”<\/strong>, with two sub-layers\n(web acquisition; document understanding) under a built\n<strong>ingestion control envelope<\/strong>: (1) an approved-source\nregister as the single entry point; (2) an acquisition contract (content\nhash, source version, ACL snapshot, fail-closed “permission unavailable”\nstate); (3) pre-parse classification and DLP through the C3 privacy\nservice; (4) a parse manifest (engine, version, model ID, config hash);\n(5) a metadata envelope on every chunk, enforced as an index gate; (6)\nOpenLineage events with firm GenAI facets, plus incremental indexing on\ncontent hash and ACL digest, with tombstones propagated to L6 and\ncaches. - Policy comes from C3; evidence is consumed by C8. Build-time\nlineage (OpenLineage) and runtime lineage (OTel traces in L9) are joined\nin the evidence pack by index version and document IDs. - An agent\nfetching web pages at run time is an L4 tool call, governed as such, not\nL8 ingestion.<\/p>\n<h2\nid=\"h8-evaluation-and-observability-are-cross-cutting-not-a-downstream-layer\">H8:\nEvaluation and observability are cross-cutting, not a downstream\nlayer<\/h2>\n<p><strong>Hypothesis.<\/strong> Evaluation and observability are\ncross-cutting, not a downstream layer (plan §4) ⟨AJ⟩.<\/p>\n<p><strong>Evidence.<\/strong> - <em>The instrumentation standard spans\nthe stack.<\/em> OTel GenAI conventions cover client inference, agents,\ntool execution, retrieval, evaluation and MCP, and evaluation results\nhave their own event type ⟨VF⟩. - <em>Tools couple CI to\nproduction.<\/em> Six of the evaluation products in the popular stack\ndiagram document a CI evaluation path, and the platforms run evaluators\nover production traces ⟨VF⟩. - <em>Vendors push the layer sideways<\/em>\ninto gateways, prompt management, guardrails and security testing ⟨VF⟩.\nEvery prompt registry is part of an observability platform or adds\nevaluation of its own ⟨VF⟩. - <em>Governance products consume evaluation\nevidence directly.<\/em> watsonx.governance Enforcement Tracking\nretrieves agent evaluation metrics against thresholds, and ValidMind\nlogs tests to the governance record ⟨VF⟩. - <em>Regulators converge on\nongoing monitoring.<\/em> AI Act Articles 26 and 72, the PRA’s AI\nroundtables under SS1/23, ESMA’s “frequent ex-post output controls” and\nIOSCO’s human-intervention indicator all require it ⟨VF⟩. -\n<em>Red-teaming is both security and validation evidence<\/em> (C7\n§C7.13) ⟨VF⟩ ⟨AJ⟩.<\/p>\n<p><strong>Counter-evidence.<\/strong> The OTel GenAI conventions are\nstill at “Development” status and recently moved repository, so the\nshared plane is not yet stable ⟨VF⟩. Independence is weakening at the\ntool level with OpenAI’s announced acquisition of Promptfoo ⟨VF⟩.<\/p>\n<p><strong>Verdict: reposition ⟨AJ⟩.<\/strong> L9 is not the last box in\nthe pipeline; it is the plane on which every other layer produces\nevidence ⟨AJ⟩.<\/p>\n<p><strong>Resulting architecture change ⟨Rec⟩.<\/strong> - L9 is drawn\nas the <strong>evaluation and observability plane<\/strong>, alongside\nthe control plane, with a firm-owned telemetry and evidence spine (OTel\nCollector with redaction, pinned semantic-convention version,\nGit-versioned datasets and scorers) and products as replaceable back\nends. - <strong>L9 and C8 form one evidence plane with two\nowners<\/strong>: L9 produces the evidence; C8 sets thresholds, approves\nand retains it in the firm-owned evidence store. - The independence rule\nis architectural: two red-team tools, one independent of the model\nvendor under test; validators extend the suite rather than reuse the\ndevelopers’ tests unchanged.<\/p>\n<hr />\n", "stacks": "<h1 id=\"part-vii-four-reference-stacks\">Part VII: Four reference\nstacks<\/h1>\n<p>The plan asks for four stacks with different priorities (plan §12.2).\nBy the reader’s decision, <strong>Stack A (regulated enterprise) is the\nlead stack<\/strong>, and B, C and D are alternatives for firms whose\nconstraints differ (CP4-5) ⟨AJ⟩. Every table shows the cloud-neutral\nchoice, its independent alternative, and the AWS, Azure and Google Cloud\nequivalents side by side; a per-cloud entry applies only where that\ncloud is the firm’s primary cloud, and the three columns are\nalternatives, not a shopping list ⟨AJ⟩. Tiers are the final tiers (Part\nXI); “S”, “T” and “E” abbreviate Strategic, Tactical and Experimental\n⟨AJ⟩.<\/p>\n<p><strong>How to read the Anthropic entries.<\/strong> Wherever a Claude\nmodel, the Claude Agent SDK, MCP or Agent Skills appears, an independent\nalternative is named in the same row, because the author is an Anthropic\nmodel; the tiers of Claude (CP4) and MCP (CP3) were set by the reader\n⟨AJ⟩.<\/p>\n<p><strong>Only profiled products are named.<\/strong> Every product in\nthese tables has a scored record; a cell with no profiled option says\nso. The hyperscaler model services (Bedrock, Microsoft Foundry, Gemini\nEnterprise Agent Platform) are named as access patterns and are not\nscored (I.4); platform features named inside a profiled product’s cell\n(for example API Center with APIM, or application inference profiles\nwith Bedrock) are cited features of that platform, not separate\nrecommendations ⟨AJ⟩.<\/p>\n<h2 id=\"stack-a-regulated-enterprise-lead-stack\">Stack A: Regulated\nenterprise (lead stack)<\/h2>\n<p><strong>Priority.<\/strong> Private deployment, governance and\nevidence before speed: self-hosted or customer-data-plane control\ncomponents, in-region processing, a firm-owned evidence store, and a\ntested exit for every material dependency (plan §12.2) ⟨AJ⟩.<\/p>\n<table style=\"width:100%;\">\n<colgroup>\n<col style=\"width: 14%\" />\n<col style=\"width: 14%\" />\n<col style=\"width: 14%\" />\n<col style=\"width: 14%\" />\n<col style=\"width: 14%\" />\n<col style=\"width: 14%\" />\n<col style=\"width: 14%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Layer / control<\/th>\n<th>Choice (tier)<\/th>\n<th>Independent alternative<\/th>\n<th>AWS primary<\/th>\n<th>Azure primary<\/th>\n<th>Google Cloud primary<\/th>\n<th>Why ⟨AJ⟩<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>L1 models<\/td>\n<td>Two-vendor mid tier + small tier + Gemma 4 (S) or Mistral (S)\nself-hosted<\/td>\n<td>For any Claude (S, cond.) choice: GPT-6.1 Sol (S), Gemini 3.8 Flash\n(S, cond.) or Mistral Medium 3.5 (S)<\/td>\n<td>Claude Sonnet 5.5 or a GPT-6 tier on Bedrock in an EU region\n(confirm GPT-6 EU availability); the other, or Mistral, as fallback<\/td>\n<td>GPT-6.1 Sol in a Foundry EU Data Zone; Mistral Medium 3.5\nfallback<\/td>\n<td>Gemini 3.8 Flash in an EU region; Claude Sonnet 5.5 via Google Cloud\nEU fallback, or Mistral (confirm model and region)<\/td>\n<td>Portfolio, not a bet; every model pinned and re-qualified ⟨AJ⟩<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>L2 inference<\/td>\n<td>Primary cloud’s model service in region (pattern) + vLLM private\nroute (S)<\/td>\n<td>SGLang (S, cond.) as qualified backup engine once CVE-2026-3059 is\nconfirmed fixed<\/td>\n<td>Bedrock geographic/in-Region<\/td>\n<td>Foundry Data Zone or Regional<\/td>\n<td>Gemini Enterprise Agent Platform regional endpoint<\/td>\n<td>Overseen provider; in-region processing; drilled stressed exit\n⟨VF⟩<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>L3 orchestration<\/td>\n<td>LangGraph (S) + Temporal (S) self-hosted in region<\/td>\n<td>Pydantic AI (S, cond.) for typed steps; no profiled alternative to\nTemporal (DBOS not profiled)<\/td>\n<td>Strands on AgentCore Runtime (S, cond.)<\/td>\n<td>Microsoft Agent Framework (S) on Foundry Hosted Agents<\/td>\n<td>ADK on Agent Engine (S, cond.)<\/td>\n<td>Deterministic graphs; durable resume; approval interrupts ⟨VF⟩<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>L4 tools<\/td>\n<td>Read-only MCP servers owned by system teams behind the\ntool-governance sub-layer (MCP S, cond.); E2B BYOC sandbox (T)<\/td>\n<td>OpenAPI-described tools behind the same gateway (independent of the\nAnthropic-originated MCP)<\/td>\n<td>AgentCore Gateway + Identity (S, cond.)<\/td>\n<td>APIM AI gateway (S, cond.) + API Center private registry<\/td>\n<td>Apigee MCP (S, cond.)<\/td>\n<td>Authorisation optional in MCP, so enforcement lives in the gateway\n⟨VF⟩<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>L5 memory<\/td>\n<td>None at first; style memory in Git (C5)<\/td>\n<td>Graphiti self-hosted (Zep record, T) or Mem0 OSS (T) behind a firm\nmemory API, later<\/td>\n<td>AgentCore Memory (S, cond.) later<\/td>\n<td>No Azure service profiled ⟨NPV⟩<\/td>\n<td>Memory Bank (S, cond.) later<\/td>\n<td>Memory is a regulated record class; build last ⟨AJ⟩<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>L6 stores<\/td>\n<td>pgvector on managed PostgreSQL (S); Elasticsearch (S) where\noperated<\/td>\n<td>Qdrant or Milvus (S) only after the load test<\/td>\n<td>pgvector on RDS/Aurora<\/td>\n<td>pgvector on Azure Database for PostgreSQL<\/td>\n<td>pgvector on Cloud SQL<\/td>\n<td>Derived index in a platform already secured, retained and exited\n⟨VF⟩<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>L7 retrieval optimisation<\/td>\n<td>Sentence Transformers serving an Apache-2.0 model (S); Cohere\nprivate deployment where support is needed (T)<\/td>\n<td>NVIDIA NeMo Retriever (T) in NVIDIA estates<\/td>\n<td>Cohere or Voyage on SageMaker (T)<\/td>\n<td>Cohere on Foundry (T)<\/td>\n<td>Gemini Embedding 2 (S, cond.) if UK-only processing is not\nmandatory<\/td>\n<td>In-estate embedding; versions pinned; reranker swappable ⟨VF⟩<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>L8 ingestion<\/td>\n<td>Docling (S) + Unstructured ingest connectors (S) inside the built\ncontrol envelope<\/td>\n<td>Reducto on-prem or Mistral OCR self-managed (T) for hard\ndocuments<\/td>\n<td>Same, in the firm’s account<\/td>\n<td>Same<\/td>\n<td>Google Document AI (S, cond.), processor region confirmed<\/td>\n<td>Open document model; parsers replaceable; lineage built, not bought\n⟨VF⟩<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>L9 evaluation<\/td>\n<td>Firm OTel Collector; Langfuse self-hosted with Enterprise licence\n(S); DeepEval (T); Promptfoo (T) + an independent red-team tool<\/td>\n<td>Opik + Comet Enterprise (T); MLflow (S) where an ML platform\nexists<\/td>\n<td>MLflow on SageMaker (S)<\/td>\n<td>MLflow on Azure ML (S)<\/td>\n<td>Langfuse self-hosted on the firm’s Kubernetes<\/td>\n<td>In-estate traces; two red-team tools, one independent of the model\nvendor ⟨AJ⟩<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>C1 gateway<\/td>\n<td>LiteLLM Enterprise, self-hosted, pinned and signed (S, cond.); or\nKong AI Gateway hybrid (S, cond.: Kong is the API standard)<\/td>\n<td>agentgateway (T) for MCP/A2A-led Kubernetes estates<\/td>\n<td>AgentCore Gateway for MCP (S, cond.); model routing stays on the\ncloud-neutral gateway until inference targets are GA<\/td>\n<td>APIM AI policies in GA tiers (S, cond.); not the preview AI Gateway\ntier<\/td>\n<td>Apigee hybrid in a UK/EU region (S, cond.)<\/td>\n<td>One gateway of record makes exit a configuration change; the LiteLLM\nPyPI compromise makes pinning and signing non-negotiable ⟨VF⟩<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>C2 guardrails<\/td>\n<td>Firm-coded deterministic checks + NeMo Guardrails orchestrating\nPrompt Guard 2 and a second detector (T)<\/td>\n<td>Check Point AI Guardrails, formerly Lakera Guard (T), as the second\ndetector<\/td>\n<td>Bedrock Guardrails, Classic tier, region-pinned (S, cond.)<\/td>\n<td>Azure AI Content Safety, Prompt Shields on documents (S, cond.)<\/td>\n<td>Model Armor, strict residency (S, cond.)<\/td>\n<td>Policy and test sets are the firm’s; detectors are swappable; NeMo\nis still 0.x ⟨VF⟩<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>C3 privacy<\/td>\n<td>Presidio behind a firm privacy-service API (S, cond.)<\/td>\n<td>Google Sensitive Data Protection where Google Cloud is primary<\/td>\n<td>Presidio; Bedrock Guardrails PII filter behind the same API<\/td>\n<td>Presidio; Purview DSPM for posture (S, cond.)<\/td>\n<td>Sensitive Data Protection (S, cond.)<\/td>\n<td>Community-governed, MIT, runs in-estate ⟨VF⟩<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>C4 identity<\/td>\n<td>Workforce IdP agent identities + OPA (S) + SPIFFE/SPIRE (S)<\/td>\n<td>Cedar (S) as the policy language on AWS<\/td>\n<td>AgentCore Identity + Policy (Cedar) (S, cond.)<\/td>\n<td>Entra Agent ID (S, cond.)<\/td>\n<td>Okta for AI Agents (S, cond.) or Entra, with OPA<\/td>\n<td>Agents follow the humans’ IdP; OPA and SPIRE are CNCF graduated\n⟨VF⟩<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>C5 configuration<\/td>\n<td>Git as system of record; prompts as code (S); registry of the L9\nplatform (Langfuse or LangSmith prompts, S)<\/td>\n<td>PromptLayer in the firm’s AWS account (T)<\/td>\n<td>Same<\/td>\n<td>Same<\/td>\n<td>Same<\/td>\n<td>Prompt text is IP and exit content; it must not live only in a\nvendor registry ⟨AJ⟩<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>C6 FinOps<\/td>\n<td>Gateway cost attribution (S) + firm-owned FOCUS-shaped dataset\n(S)<\/td>\n<td>Vantage or CloudZero (T) as reporting only<\/td>\n<td>+ Bedrock application inference profiles for reconciliation<\/td>\n<td>+ Foundry project tags<\/td>\n<td>Gateway metering (no Google-native option profiled)<\/td>\n<td>Cost per task needs the gateway and the trace ⟨AJ⟩<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>C7 security<\/td>\n<td>Vault Enterprise agentic IAM (S, cond. on BUSL); safetensors +\nscanning gate (S); runtime detector behind C1 (T)<\/td>\n<td>HiddenLayer (T) as the independent detector<\/td>\n<td>Cloud secrets + workload identity where single-cloud<\/td>\n<td>Same<\/td>\n<td>Same<\/td>\n<td>Capability separation first; detectors replaceable ⟨VF⟩<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>C8 governance<\/td>\n<td>Firm-owned evidence store and inventory schema; OpenLineage (S)<\/td>\n<td>ValidMind, watsonx.governance, Collibra or Credo AI (all T) as a\nreplaceable workflow layer<\/td>\n<td>Same<\/td>\n<td>Same<\/td>\n<td>Same<\/td>\n<td>No governance platform reaches Strategic on public evidence\n⟨AJ⟩<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Build now (Stack A) ⟨Rec⟩.<\/strong> The firm GenAI model-risk\nstandard and inventory schema; the evidence store; the gateway (two\ndeployments) with the first two model routes and a vLLM exit route; the\nOTel Collector, evaluation datasets and CI harness; the privacy-service\nAPI on Presidio; agent registration and OBO in the workforce IdP with\nOPA; the configuration manifest in Git; pgvector retrieval with\nentitlement filtering; the first deterministic workflow with read-only\nMCP tools; budgets that fail closed.<\/p>\n<p><strong>Do NOT build yet (Stack A) ⟨Rec⟩.<\/strong> Long-term memory\nof any kind; multi-agent or A2A delegation; autonomous agent loops with\nwrite tools; an own-GPU fleet beyond the single exit route; llm-d or\nDynamo; a dedicated vector database without a failed load test; Pinecone\nNexus or any knowledge engine as a system of record; fine-tuning; a\npurchased governance platform before the evidence store exists; the\nClaude Agent SDK or other Alpha or pre-1.0 harnesses in a regulated\npath; Agent Skills with scripts.<\/p>\n<h2 id=\"stack-b-cloud-native-managed\">Stack B: Cloud-native managed<\/h2>\n<p><strong>Priority.<\/strong> Speed, scalability, managed services and\ndeveloper productivity: take the primary cloud’s lead service in each\ncategory, accept the concentration consciously, and keep the firm-owned\nevidence and configuration so that exit remains possible (plan §12.2)\n⟨AJ⟩. Under CP3 rule 10 these lead services are Strategic, conditional\non the cloud being primary ⟨AJ⟩.<\/p>\n<table style=\"width:100%;\">\n<colgroup>\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Layer / control<\/th>\n<th>AWS primary<\/th>\n<th>Azure primary<\/th>\n<th>Google Cloud primary<\/th>\n<th>Independent alternative kept<\/th>\n<th>Why ⟨AJ⟩<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>L1 models<\/td>\n<td>Claude Sonnet 5.5 (S, cond.) or GPT-6 tier (S, confirm EU\navailability); the other, or Mistral, as fallback<\/td>\n<td>GPT-6.1 Sol (S); Mistral Medium 3.5 (S)<\/td>\n<td>Gemini 3.8 Flash (S, cond.); Claude Sonnet 5.5 (S, cond.) or Mistral\nfallback<\/td>\n<td>Mistral EU endpoint; Gemma 4<\/td>\n<td>Two vendors in-tenant; for Claude, GPT-6.1 Sol, Gemini or Mistral\nnamed as independent alternatives<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>L2 inference<\/td>\n<td>Bedrock (pattern, not scored)<\/td>\n<td>Foundry (pattern, not scored)<\/td>\n<td>Gemini Enterprise Agent Platform (pattern, not scored)<\/td>\n<td>Fireworks AI (S, cond.) BYOC or EU dedicated, once ISO certificates\nare confirmed<\/td>\n<td>Managed capacity, in-geography processing<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>L3 orchestration<\/td>\n<td>Strands on AgentCore Runtime (S, cond.)<\/td>\n<td>Microsoft Agent Framework on Foundry Hosted Agents (S)<\/td>\n<td>ADK on Agent Engine (S, cond.)<\/td>\n<td>LangGraph<\/td>\n<td>Framework-agnostic runtimes host open frameworks ⟨VF⟩<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>L4 tools<\/td>\n<td>AgentCore Gateway + Identity (S, cond.)<\/td>\n<td>APIM AI gateway (S, cond.) + API Center registry<\/td>\n<td>Apigee MCP (S, cond.)<\/td>\n<td>OpenAPI tools (alternative to the Anthropic-originated MCP)<\/td>\n<td>Managed tool governance<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>L5 memory<\/td>\n<td>AgentCore Memory (S, cond.)<\/td>\n<td>Not profiled ⟨NPV⟩<\/td>\n<td>Memory Bank (S, cond.)<\/td>\n<td>Firm memory API + export<\/td>\n<td>Where the runtime already lives<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>L6 stores<\/td>\n<td>pgvector on Aurora; S3 Vectors (T) as cost tier behind a search\nengine (OpenSearch not profiled ⟨NPV⟩)<\/td>\n<td>pgvector on Azure Database for PostgreSQL (Azure AI Search not\nprofiled ⟨NPV⟩)<\/td>\n<td>pgvector on Cloud SQL (Vertex AI Vector Search not profiled\n⟨NPV⟩)<\/td>\n<td>Qdrant BYOC<\/td>\n<td>Managed relational vectors<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>L7 retrieval optimisation<\/td>\n<td>Cohere on SageMaker (T)<\/td>\n<td>Cohere on Foundry (T)<\/td>\n<td>Gemini Embedding 2 (S, cond.)<\/td>\n<td>Sentence Transformers<\/td>\n<td>Platform-contracted embeddings<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>L8 ingestion<\/td>\n<td>Unstructured Transform API in-VPC (S)<\/td>\n<td>Same<\/td>\n<td>Document AI (S, cond.)<\/td>\n<td>Docling<\/td>\n<td>Managed parsing, ACL connectors<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>L9 evaluation<\/td>\n<td>MLflow on SageMaker (S) or LangSmith (S)<\/td>\n<td>MLflow on Azure ML (S)<\/td>\n<td>LangSmith EU or Langfuse Cloud EU<\/td>\n<td>DeepEval + independent red-team<\/td>\n<td>Managed, in region<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>C1 gateway<\/td>\n<td>AgentCore Gateway (S, cond.) for tools; LiteLLM-based multi-provider\nguidance for models ⟨VF⟩<\/td>\n<td>APIM AI gateway, GA policies (S, cond.)<\/td>\n<td>Apigee (S, cond.)<\/td>\n<td>LiteLLM or Kong config kept as exit route<\/td>\n<td>Managed, already contracted<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>C2 guardrails<\/td>\n<td>Bedrock Guardrails (S, cond.)<\/td>\n<td>Azure AI Content Safety (S, cond.)<\/td>\n<td>Model Armor (S, cond.)<\/td>\n<td>NeMo Guardrails with a second detector<\/td>\n<td>Called from the gateway as a standalone API<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>C3 privacy<\/td>\n<td>Bedrock Guardrails PII filter behind the firm API<\/td>\n<td>Purview DSPM (S, cond.) for posture; Presidio in the prompt\npath<\/td>\n<td>Sensitive Data Protection (S, cond.)<\/td>\n<td>Presidio (S, cond.)<\/td>\n<td>Posture is not prompt-path DLP ⟨VF⟩<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>C4 identity<\/td>\n<td>AgentCore Identity + Policy (Cedar) (S, cond.)<\/td>\n<td>Entra Agent ID (S, cond.) with Agent 365<\/td>\n<td>Okta or Entra + OPA<\/td>\n<td>OPA policies in Git<\/td>\n<td>Agent identities follow the humans<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>C5 configuration<\/td>\n<td>Git + LangSmith or Langfuse prompts<\/td>\n<td>Git + registry<\/td>\n<td>Git + registry<\/td>\n<td>Git is the exit<\/td>\n<td>Registries are caches<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>C6 FinOps<\/td>\n<td>Application inference profiles + gateway keys ⟨VF⟩<\/td>\n<td>Foundry project tags + gateway keys ⟨VF⟩<\/td>\n<td>Gateway keys<\/td>\n<td>FOCUS-shaped dataset<\/td>\n<td>Cost per task<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>C7 security<\/td>\n<td>Cloud secrets + workload identity; Prisma AIRS (T) if a Palo Alto\nshop<\/td>\n<td>Same<\/td>\n<td>Same<\/td>\n<td>HiddenLayer (T)<\/td>\n<td>Detector from the existing security supplier<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>C8 governance<\/td>\n<td>Firm evidence store + watsonx.governance or Credo AI (T)<\/td>\n<td>Same, or Collibra (T)<\/td>\n<td>Same<\/td>\n<td>Firm schema and nightly export<\/td>\n<td>Tool replaceable over firm evidence<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Build now (Stack B) ⟨Rec⟩.<\/strong> The same control-plane\nminimum as Stack A, but on managed services: gateway, guardrails and\nidentity from the primary cloud; the evidence store and Git manifest\nowned by the firm; one managed agent runtime; managed retrieval on the\noperational database; two models in-tenant.<\/p>\n<p><strong>Do NOT build yet (Stack B) ⟨Rec⟩.<\/strong> A second cloud’s\nagent stack; a self-hosted GPU route beyond a documented open-weight\nexit on a second provider; preview-tier services in the regulated path\n(APIM AI Gateway tier, Durable Task, AgentCore inference targets) ⟨VF⟩;\nhosted agent state (OpenAI hosted Agents API, Claude Managed Agents,\nMistral Agents API) for client data ⟨VF⟩.<\/p>\n<h2 id=\"stack-c-open-source-first\">Stack C: Open-source first<\/h2>\n<p><strong>Priority.<\/strong> Portability, control and minimum vendor\nlock-in: every component has an open licence and a self-hosted route,\nand the hyperscaler is used as infrastructure (managed Kubernetes and\ndatabases), not as a platform (plan §12.2) ⟨AJ⟩.<\/p>\n<table>\n<colgroup>\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Layer / control<\/th>\n<th>Choice (tier)<\/th>\n<th>Licence / governance<\/th>\n<th>AWS / Azure / Google Cloud equivalent (infrastructure only)<\/th>\n<th>Why ⟨AJ⟩<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>L1 models<\/td>\n<td>Gemma 4 (S), Mistral Medium 3.5 / Large 3 (S), gpt-oss-120b (OpenAI\nrecord, S); Hugging Face Hub (S, cond.) as governed supply<\/td>\n<td>Gemma 4 Apache-2.0; Mistral Medium 3.5 Modified MIT, Large 3\nApache-2.0; gpt-oss Apache-2.0 ⟨VF⟩<\/td>\n<td>Same<\/td>\n<td>Weights the firm holds; a hosted frontier model may still be added\nthrough the gateway<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>L2 inference<\/td>\n<td>vLLM (S); SGLang (S, cond.); llm-d (E) pilot only<\/td>\n<td>Apache-2.0, PyTorch Foundation / LMSYS ⟨VF⟩<\/td>\n<td>GPU instances on any of the three<\/td>\n<td>Own the serving path<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>L3 orchestration<\/td>\n<td>LangGraph (S) + Temporal (S); Pydantic AI (S, cond.)<\/td>\n<td>MIT ⟨VF⟩<\/td>\n<td>Same<\/td>\n<td>Portable between self-host and cloud<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>L4 tools<\/td>\n<td>MCP (S, cond.) and A2A (S, cond.) behind agentgateway<\/td>\n<td>MIT spec and Apache-2.0 under AAIF ⟨VF⟩; independent alternative to\nMCP: OpenAPI tools<\/td>\n<td>Same<\/td>\n<td>Open protocols, firm-run registry<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>L5 memory<\/td>\n<td>Graphiti self-hosted (Zep record) or Mem0 OSS (T), later<\/td>\n<td>Open<\/td>\n<td>Same<\/td>\n<td>Behind a firm memory API<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>L6 stores<\/td>\n<td>pgvector (S); Qdrant (S); Milvus (S)<\/td>\n<td>Permissive ⟨VF⟩<\/td>\n<td>Managed PostgreSQL on any of the three<\/td>\n<td>Rebuildable derived index<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>L7 retrieval optimisation<\/td>\n<td>Sentence Transformers (S); Qwen3 Embedding (T) after provenance\nreview<\/td>\n<td>Apache-2.0 ⟨VF⟩<\/td>\n<td>Same<\/td>\n<td>Self-hosted, fine-tunable<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>L8 ingestion<\/td>\n<td>Docling (S); Unstructured OSS (S); Crawl4AI (E) for pilots<\/td>\n<td>MIT / Apache-2.0 ⟨VF⟩<\/td>\n<td>Same<\/td>\n<td>Open document model<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>L9 evaluation<\/td>\n<td>Langfuse (S) or MLflow (S); Opik (T); DeepEval (T)<\/td>\n<td>MIT core / Apache-2.0 ⟨VF⟩<\/td>\n<td>Same<\/td>\n<td>Portable traces and datasets<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>C1 gateway<\/td>\n<td>LiteLLM (S, cond.) or agentgateway (T)<\/td>\n<td>Open core; agentgateway under an open foundation ⟨VF⟩<\/td>\n<td>Managed Kubernetes on any of the three<\/td>\n<td>Neutral, portable; Enterprise features need a licence<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>C2 guardrails<\/td>\n<td>NeMo Guardrails (T) + Prompt Guard 2 / Llama Guard 4 (T)<\/td>\n<td>Open; Meta components unchanged since May 2025 ⟨VF⟩<\/td>\n<td>Same<\/td>\n<td>Keep two detectors from different owners<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>C3 privacy<\/td>\n<td>Presidio (S, cond.)<\/td>\n<td>MIT, community-governed ⟨VF⟩<\/td>\n<td>Same<\/td>\n<td>In-estate detection<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>C4 identity<\/td>\n<td>OPA (S), SPIFFE/SPIRE (S), MCP authorisation (S, cond.)<\/td>\n<td>CNCF graduated ⟨VF⟩<\/td>\n<td>Cloud workload identity federation as an alternative<\/td>\n<td>Open policy and workload identity<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>C5 configuration<\/td>\n<td>Prompts as code (S) with Prompty or Dotprompt<\/td>\n<td>Open formats ⟨VF⟩<\/td>\n<td>Same<\/td>\n<td>Git is the record<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>C6 FinOps<\/td>\n<td>Gateway cost attribution (S) + FOCUS (S)<\/td>\n<td>Open standard ⟨VF⟩<\/td>\n<td>Same<\/td>\n<td>No proprietary allocation engine<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>C7 security<\/td>\n<td>Model scanning + safetensors (S); OpenSSF Model Signing (T)<\/td>\n<td>Apache-2.0, foundation-governed ⟨VF⟩<\/td>\n<td>Same<\/td>\n<td>Supply-chain gate<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>C8 governance<\/td>\n<td>OpenLineage (S) + firm evidence store<\/td>\n<td>Apache-2.0, LF AI &amp; Data ⟨VF⟩<\/td>\n<td>Same<\/td>\n<td>No vendor governance platform needed at first<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Build now (Stack C) ⟨Rec⟩.<\/strong> The same control-plane\nminimum, self-hosted; an internal model registry with hash pinning and\nan internal mirror for weights; one serving engine with an SRE rota able\nto patch monthly.<\/p>\n<p><strong>Do NOT build yet (Stack C) ⟨Rec⟩.<\/strong> A second serving\nengine before the first is stable; an optimisation layer; multi-agent\nsystems; Chinese-origin weights without an explicit policy decision; any\ncomponent whose “open source” licence has not been reviewed (AGPL\nFirecrawl server, MinerU above its thresholds, CC-BY-NC Jina weights)\n⟨VF⟩.<\/p>\n<h2 id=\"stack-d-minimal-start-small\">Stack D: Minimal start-small<\/h2>\n<p><strong>Priority.<\/strong> The minimum viable enterprise platform\nthat can safely run one regulated use case, with an explicit list of\nwhat not to build (plan §12.2) ⟨AJ⟩. It is Stack A with everything not\nneeded for the first use case removed, not a weaker stack ⟨AJ⟩.<\/p>\n<table style=\"width:100%;\">\n<colgroup>\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Layer / control<\/th>\n<th>Minimum choice<\/th>\n<th>AWS primary<\/th>\n<th>Azure primary<\/th>\n<th>Google Cloud primary<\/th>\n<th>Why it is the minimum ⟨AJ⟩<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>L2 / L1<\/td>\n<td>Primary cloud model service; two vendors qualified<\/td>\n<td>Bedrock: Claude Sonnet 5.5 or a GPT-6 tier (confirm EU\navailability), the other or Mistral as fallback<\/td>\n<td>Foundry: GPT-6.1 Sol, Mistral fallback<\/td>\n<td>Gemini 3.8 Flash; Claude fallback (Mistral as the independent\nalternative)<\/td>\n<td>Two vendors from day one, because exit must be real<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>L3<\/td>\n<td>LangGraph with a Postgres checkpointer<\/td>\n<td>or Strands on AgentCore<\/td>\n<td>or Microsoft Agent Framework<\/td>\n<td>or ADK<\/td>\n<td>One graph, one approval gate<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>L4<\/td>\n<td>One read-only MCP tool (or OpenAPI tool as the independent\nalternative)<\/td>\n<td>via AgentCore Gateway<\/td>\n<td>via APIM<\/td>\n<td>via Apigee<\/td>\n<td>Authoritative data, no writes<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>L8–L6<\/td>\n<td>Docling + pgvector with entitlement filters<\/td>\n<td>pgvector on RDS<\/td>\n<td>pgvector on Azure Database for PostgreSQL<\/td>\n<td>pgvector on Cloud SQL<\/td>\n<td>One store, already secured<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>L9<\/td>\n<td>OTel Collector; Langfuse or MLflow; DeepEval + Promptfoo + one\nindependent tool<\/td>\n<td>MLflow on SageMaker<\/td>\n<td>MLflow on Azure ML<\/td>\n<td>Langfuse self-hosted<\/td>\n<td>The suite is the validation evidence and the exit test<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>C1 gateway<\/td>\n<td>One gateway (two instances), one route, budgets<\/td>\n<td>LiteLLM self-hosted, or AgentCore Gateway for tools<\/td>\n<td>APIM GA AI policies<\/td>\n<td>Apigee<\/td>\n<td>Without it there is no exit and no log of record<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>C2 / C3<\/td>\n<td>Deterministic output checks + Presidio<\/td>\n<td>+ Bedrock Guardrails<\/td>\n<td>+ Content Safety<\/td>\n<td>+ Model Armor<\/td>\n<td>Numbers and client identifiers are the two real risks<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>C4<\/td>\n<td>Agent registered in the workforce IdP; OBO; read-only scope<\/td>\n<td>AgentCore Identity<\/td>\n<td>Entra Agent ID<\/td>\n<td>Okta or Entra<\/td>\n<td>Attribution of every action<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>C5<\/td>\n<td>Git manifest, PR with second approver<\/td>\n<td>Same<\/td>\n<td>Same<\/td>\n<td>Same<\/td>\n<td>Change control is the cheapest control<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>C6<\/td>\n<td>Gateway key and budget that fails closed<\/td>\n<td>Same<\/td>\n<td>Same<\/td>\n<td>Same<\/td>\n<td>Prevents runaway loops<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>C7<\/td>\n<td>No outbound tools; pinned dependencies from a mirror<\/td>\n<td>Same<\/td>\n<td>Same<\/td>\n<td>Same<\/td>\n<td>Capability separation costs nothing<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>C8<\/td>\n<td>Inventory entry + evidence pack in an existing WORM archive<\/td>\n<td>Same<\/td>\n<td>Same<\/td>\n<td>Same<\/td>\n<td>Regulators ask for this first<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Build now (Stack D) ⟨Rec⟩.<\/strong> Exactly the table above,\nfor one use case (the attribution commentary is a good first candidate\nbecause its boundaries are clear and its numbers are checkable).<\/p>\n<p><strong>Do NOT build yet (Stack D) ⟨Rec⟩.<\/strong> Memory; agents\nwith autonomy; A2A; MCP beyond the first read-only tool; web search;\ncode sandboxes; a dedicated vector database; a second cloud; self-hosted\nserving beyond a documented exit option; fine-tuning; a governance\nplatform; a FinOps SaaS; a runtime AI-security platform; semantic\ncaching; Agent Skills; any Experimental product (Part XI).<\/p>\n<hr />\n", "final": "<h1 id=\"part-xi-final-recommended-enterprise-stack\">Part XI: Final\nrecommended enterprise stack<\/h1>\n<blockquote>\n<p><strong>“If I were building a serious enterprise GenAI platform\ntoday, which products would I actually select, and which would I\ndeliberately NOT select?”<\/strong> (plan §12)<\/p>\n<\/blockquote>\n<p>This part answers the plan’s question with every scored product\nplaced in one of five categories. Tiers are the final tiers after the\nCP4 decisions; scores are not re-argued here ⟨AJ⟩. A Strategic tier\nalways carries its condition, and the cloud-conditional Strategic items\nare alternatives chosen by primary cloud, not cumulative recommendations\n⟨AJ⟩. The conflict-of-interest rule applies throughout: each Anthropic\nproduct or Anthropic-originated standard is listed with an independent\nalternative ⟨AJ⟩.<\/p>\n<h2 id=\"xi.1-strategic-choices-cloud-neutral-core-41\">XI.1 Strategic\nchoices: cloud-neutral core (41)<\/h2>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Ref<\/th>\n<th>Product<\/th>\n<th>Condition<\/th>\n<th>One-line reason<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>L1<\/td>\n<td>OpenAI GPT<\/td>\n<td>Mid-tier primary or fallback; Luna for the small tier<\/td>\n<td>Most complete tier ladder; first-party EU processing ⟨VF⟩<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>L1<\/td>\n<td>Anthropic Claude<\/td>\n<td>Hyperscaler UK/EU route only, with a qualified non-Anthropic\nfallback; FS 3.80, tier set by the reader at CP4 (CP4-1); independent\nalternatives: GPT-6.1 Sol, Gemini 3.8 Flash, Mistral Medium 3.5<\/td>\n<td>SOC 2, ISO 27001 and ISO 42001 with the API, Bedrock and Google\nCloud routes in scope (Azure-hosted Foundry deployment still in\nprocess); available on
